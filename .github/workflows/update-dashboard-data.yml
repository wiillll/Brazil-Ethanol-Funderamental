name: Update ethanol dashboard data

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/dashboard.json'
  schedule:
    - cron: '30 3 2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p data && python scripts/update_data.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git diff --cached --quiet || git commit -m "data: refresh ANP ethanol dashboard"
          git push
