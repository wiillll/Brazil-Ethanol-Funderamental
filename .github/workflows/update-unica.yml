name: Update UNICA biweekly data

on:
  workflow_dispatch:
  schedule:
    - cron: '25 10 * * 1,4'

permissions:
  contents: write

jobs:
  update-unica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --upgrade pdfplumber
      - name: Update UNICA structured data
        run: python scripts/unica/update_live.py
      - name: Validate UNICA data before publish
        run: python scripts/unica/validate_data.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/unica-dashboard.json data/.unica-update-state.json; then
            echo "No UNICA data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unica-dashboard.json data/.unica-update-state.json
          git commit -m "data: update UNICA biweekly ethanol dataset"
          git push
